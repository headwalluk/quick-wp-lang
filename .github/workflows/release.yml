name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: |
          # Remove 'v' prefix from tag (v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Plugin version: ${VERSION}"

      - name: Verify version numbers agree
        env:
          TAG_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail

          # The updater compares the installed version with the tag, so a
          # mismatch makes sites see a permanent phantom update.
          HEADER_VERSION=$(sed -n 's/^ \* Version:[[:space:]]*\(.*\)$/\1/p' quick-wp-lang.php | head -1 | tr -d '[:space:]')
          CONSTANT_VERSION=$(sed -n "s/^define( 'QUICK_WP_LANG_VERSION', '\(.*\)' );[[:space:]]*$/\1/p" quick-wp-lang.php | head -1 | tr -d '[:space:]')
          README_VERSION=$(sed -n 's/^Stable tag:[[:space:]]*\(.*\)$/\1/p' readme.txt | head -1 | tr -d '[:space:]')

          echo "Git tag ................ ${TAG_VERSION}"
          echo "Plugin header .......... ${HEADER_VERSION}"
          echo "QUICK_WP_LANG_VERSION .. ${CONSTANT_VERSION}"
          echo "readme.txt stable tag .. ${README_VERSION}"

          VERSION_MISMATCH=0
          for CANDIDATE_VERSION in "${HEADER_VERSION}" "${CONSTANT_VERSION}" "${README_VERSION}"; do
            if [ "${CANDIDATE_VERSION}" != "${TAG_VERSION}" ]; then
              VERSION_MISMATCH=1
            fi
          done

          if [ "${VERSION_MISMATCH}" -ne 0 ]; then
            echo "::error::Version mismatch. The plugin header, QUICK_WP_LANG_VERSION and the readme.txt stable tag must all read ${TAG_VERSION}."
            exit 1
          fi

          echo "All version numbers agree on ${TAG_VERSION}."

      - name: Prepare plugin directory
        run: |
          mkdir -p build
          rsync -av --exclude-from=.distignore ./ build/quick-wp-lang/

      - name: Build release zips
        # Build the versioned zip once, then copy it to the generic
        # filename so both artifacts are guaranteed byte-identical
        # (same SHA256, just different filenames).
        run: |
          cd build
          zip -r quick-wp-lang-${{ steps.get_version.outputs.version }}.zip quick-wp-lang/
          cp quick-wp-lang-${{ steps.get_version.outputs.version }}.zip quick-wp-lang.zip
          cd ..

      - name: Upload versioned zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: quick-wp-lang-${{ steps.get_version.outputs.version }}
          path: build/quick-wp-lang-${{ steps.get_version.outputs.version }}.zip

      - name: Upload generic zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: quick-wp-lang
          path: build/quick-wp-lang.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/quick-wp-lang-${{ steps.get_version.outputs.version }}.zip
            build/quick-wp-lang.zip
          body: |
            **Quick WP Lang v${{ steps.get_version.outputs.version }}**

            Set the language of individual posts and pages for SEO, and link translations to their original.

            Download `quick-wp-lang.zip` and install via WordPress admin (Plugins → Add New → Upload Plugin), or upload to your `wp-content/plugins/` directory.

            Sites running a previous version will receive this update automatically via the in-plugin GitHub updater.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full release notes.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
